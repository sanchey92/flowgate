env: dev
log_level: debug

server:
  instance_id: fg-node-1
  shutdown_timeout: 10s

proxy:
  connect_timeout: 5s
  idle_timeout: 60s
  keepalive: 30s
  max_conns: 1024
  buf_size: 32768
  proxyproto_header_timeout: 3s
  backoff:
    base: 100ms
    max: 5s
  udp:
    session_idle: 30s
    backend_read: 5s
    dial: 2s
  http:
    request_timeout: 60s
    response_header_timeout: 30s
    write_timeout: 0s
    read_header_timeout: 5s
    retry:
      enabled: true
      max_retries: 2               # дополнительных попыток сверх первой (итого до 3 заходов)
      retry_on:                    # если список пуст → connection_error, 502, 503, 504
        - connection_error         # отказ соединения и прочие сетевые ошибки
        - reset                    # ECONNRESET — соединение сброшено бэкендом
        - "502"
        - "503"
        - "504"
        # - timeout                # сетевые таймауты (response_header_timeout и т.п.);
        #                          # осторожно: каждая попытка может ждать до 30s
      backoff_base: 100ms          # задержка перед первым ретраем, дальше ×2 (+джиттер)
      backoff_max: 2s              # потолок задержки между попытками
      budget_percent: 20           # ретраев не больше 20% первичного трафика роута
                                   # в скользящем окне 10s — защита от retry storm
      idempotent_only: true        # ретраить только идемпотентные методы и запросы
                                   # с заголовком Idempotency-Key; false снимает ограничение

routes:
  - name: tcp-edge
    protocol: tcp
    listen: ":18080"
    balancer: round_robin
    proxy_protocol: off
    health_check:
      active:
        enabled: true
        interval: 10s              # период между пробами (должен быть > timeout)
        timeout: 3s                # дедлайн одной пробы
        unhealthy_threshold: 3     # подряд провалов → backend помечается unhealthy
        healthy_threshold: 2       # подряд успехов → backend восстанавливается
        # path / expected_status для tcp не используются:
        # проба делает только TCP-dial до addr и сразу закрывает соединение
    backends:
      - addr: "127.0.0.1:9001"
        weight: 5
      - addr: "127.0.0.1:9002"
        weight: 3

  - name: udp-edge
    protocol: udp
    listen: ":18081"
    balancer: least_conn
    # health_check для udp намеренно не включён: активная проба сейчас умеет
    # только tcp-dial (http-пробер выбирается лишь для protocol: http), а tcp-dial
    # до udp-порта не валидирует udp-listener. Включать смысла нет до появления
    # udp-пробы (echo/ping).
    backends:
      - addr: "127.0.0.1:9101"
        weight: 1
      - addr: "127.0.0.1:9102"
        weight: 1

  - name: web-edge
    protocol: http
    listen: ":18082"
    balancer: round_robin
    health_check:
      active:
        enabled: true
        interval: 10s              # период между пробами (должен быть > timeout)
        timeout: 3s                # дедлайн одной пробы
        unhealthy_threshold: 3     # подряд провалов → backend помечается unhealthy
        healthy_threshold: 2       # подряд успехов → backend восстанавливается
        path: /healthz             # GET http://<backend.addr>/healthz
        expected_status: 200       # любой другой код = провал пробы
    # проба применяется ко всем backend'ам из всех backend_groups ниже
    http:
      standard_headers:
        enabled: true
        # под-флаги опущены → EffectiveSet включит все

      websocket:
        enabled: true

      headers:
        request:
          add:
            X-Proxy: "FlowGate"
          remove:
            - "X-Debug"
        response:
          replace:
            X-Served-By: "${backend_addr}"
          remove:
            - "Server"
            - "X-Powered-By"

      backend_groups:
        - name: api-v2
          balancer: round_robin
          backends:
            - addr: "127.0.0.1:9201"
              weight: 5
            - addr: "127.0.0.1:9202"
              weight: 5
        - name: api-v1
          balancer: least_conn
          backends:
            - addr: "127.0.0.1:9211"
              weight: 1
        - name: default
          backends:
            - addr: "127.0.0.1:9221"
              weight: 1

      routing_rules:
        - match:
            host: "api.example.com"
            path_prefix: "/v2/"
          backend_group: api-v2

        - match:
            path_regex: "^/users/\\d+$"
          backend_group: api-v1

        - match:
            headers:
              X-API-Version: "2"
          backend_group: api-v2

        # default — ловит всё остальное
        - match:
            path_prefix: "/"
          backend_group: default